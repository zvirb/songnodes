<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>SongNodes</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      /* Design system: apply saved theme, text size, density and motion before first paint
         (mirrors SongNodes.prefs.init in design-system/components/bundle.js; keys sn-theme,
         sn-text-size, sn-density, sn-motion). */
      (function () {
        var r = document.documentElement, g = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
        var t = g('sn-theme');
        r.setAttribute('data-theme', t || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
        var s = g('sn-text-size'); if (s && s !== 'm') r.setAttribute('data-text-size', s);
        r.setAttribute('data-density', g('sn-density') === 'compact' ? 'compact' : 'comfortable');
        var m = g('sn-motion'); if (m) r.setAttribute('data-motion', m);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
