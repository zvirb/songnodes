version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      frontend-deps:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-deps:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/services/rest_api"
    schedule:
      interval: "weekly"
    groups:
      pip-rest-api:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/services/db-connection-pool"
    schedule:
      interval: "weekly"
    groups:
      pip-db-connection-pool:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/services/websocket-api"
    schedule:
      interval: "weekly"
    groups:
      pip-websocket-api:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/services/serato-integration"
    schedule:
      interval: "weekly"
    groups:
      pip-serato-integration:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/services/metadata-enrichment"
