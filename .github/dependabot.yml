        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/services/api-gateway-internal"
    schedule:
      interval: "weekly"
    groups:
      pip-api-gateway-internal:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/services/browser-collector"
    schedule:
      interval: "weekly"
    groups:
      pip-browser-collector:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/services/dlq-manager"
    schedule:
      interval: "weekly"
    groups:
      pip-dlq-manager:
        patterns:
          - "*"

  - package-ecosystem: "pip"
