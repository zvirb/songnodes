# Design-system conformance (design-system/17-governance.md, "Conformance checking").
# The SongNodes design system in design-system/ is the single source of truth for every
# formatting and design decision; this workflow keeps the frontend copy in sync and stops
# new raw colours, emoji, browser dialogs, pages without a page container and undefined
# sn-* classes in code that has moved onto the system.
name: design-system

on:
  pull_request:
    paths: ["design-system/**", "frontend/**", "scripts/sync-design-system.sh", ".github/workflows/design-system.yml"]
  push:
    branches: [main, develop]
    paths: ["design-system/**", "frontend/**", "scripts/sync-design-system.sh"]

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Layout baseline only shrinks
        if: github.event_name == 'pull_request'
        run: |
          base="origin/${{ github.base_ref }}"
          git cat-file -e "$base:frontend/design-system-layout-baseline.txt" 2>/dev/null || { echo "Baseline is new in this PR"; exit 0; }
          added=$(git diff "$base...HEAD" -- frontend/design-system-layout-baseline.txt | grep -E '^\+(class|main) ' || true)
          if [ -n "$added" ]; then
            echo "::error file=frontend/design-system-layout-baseline.txt::New layout debt cannot be added to the baseline; fix it instead:"
            echo "$added"
            exit 1
          fi
      - name: Frontend copy matches design-system/
        run: bash scripts/sync-design-system.sh --check
      - name: Design-system conformance check
        run: python3 scripts/check_design_system.py --check
      - name: Feature pages do not import each other
        run: |
          python3 scripts/check_feature_imports.py --check
          if [ "${{ github.event_name }}" = "pull_request" ] && git cat-file -e "origin/${{ github.base_ref }}:frontend/feature-imports-allowlist.txt" 2>/dev/null; then
            added=$(git diff "origin/${{ github.base_ref }}...HEAD" -- frontend/feature-imports-allowlist.txt | grep -E '^\+src/' || true)
            if [ -n "$added" ]; then
              echo "::error file=frontend/feature-imports-allowlist.txt::The allowlist only shrinks; move the shared code instead:"
              echo "$added"
              exit 1
            fi
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Type-check, lint, unit tests and build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit -p .
          npx oxlint src
          npx vitest run src
          npx vite build
