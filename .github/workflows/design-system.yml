# Design-system conformance (design-system/17-governance.md, "Conformance checking").
# The SongNodes design system in design-system/ is the single source of truth for every
# formatting and design decision; this workflow keeps the frontend copy in sync and stops
# new raw colours, emoji and browser dialogs in code that has moved onto the system.
name: design-system

on:
  pull_request:
    paths: ["design-system/**", "frontend/**", "scripts/sync-design-system.sh", ".github/workflows/design-system.yml"]
  push:
    branches: [main, develop]
    paths: ["design-system/**", "frontend/**", "scripts/sync-design-system.sh"]

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Frontend copy matches design-system/
        run: bash scripts/sync-design-system.sh --check
      - name: No raw colours, emoji or browser dialogs in frontend/src
        # Every tracked file in frontend/src except the synced design-system copy, the
        # graph's token reader (lib/graphColours.ts) and the files still listed in
        # frontend/design-system-pending.txt, which may only shrink.
        run: |
          set -euo pipefail
          pending=$(grep -v '^#' frontend/design-system-pending.txt | sed '/^$/d')
          mapfile -t files < <(git ls-files 'frontend/src/*.ts' 'frontend/src/*.tsx' 'frontend/src/*.css' \
            | grep -v '^frontend/src/styles/design-system/' | grep -vx 'frontend/src/lib/graphColours.ts' \
            | grep -vxF -f <(printf '%s\n' "$pending"))
          code=(); for f in "${files[@]}"; do case "$f" in *.ts|*.tsx) code+=("$f");; esac; done
          status=0
          if grep -nE "#[0-9a-fA-F]{3,8}\b|rgba?\(" "${files[@]}" | grep -v "design-system exception"; then echo "::error::Raw colour found; use a design-system token"; status=1; fi
          # Emoji ranges; the design system's own status glyphs (● ◐ ○ ▲ ✓ ✕ ↻) are allowed.
          if LC_ALL=C.UTF-8 grep -nP "[\x{1F300}-\x{1FAFF}\x{2600}-\x{26FF}]" "${files[@]}"; then echo "::error::Emoji found; use a Lucide icon plus a word"; status=1; fi
          if grep -nE "\b(window\.)?(alert|confirm|prompt)\(" "${code[@]}" | grep -v ":\s*//"; then echo "::error::Browser dialog found; use ConfirmDialog/Toast"; status=1; fi
          # A pending file that is now clean (or gone) must come off the list.
          while read -r f; do
            if [ ! -f "$f" ] || ! { grep -qE "#[0-9a-fA-F]{3,8}\b|rgba?\(" "$f" || LC_ALL=C.UTF-8 grep -qP "[\x{1F300}-\x{1FAFF}\x{2600}-\x{26FF}]" "$f" || grep -qE "\b(window\.)?(alert|confirm|prompt)\(" "$f"; }; then
              echo "::error file=$f::No longer needs an exemption; remove it from frontend/design-system-pending.txt"; status=1
            fi
          done <<< "$pending"
          exit $status
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Type-check, unit tests and build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit -p .
          npx vitest run src
          npx vite build
