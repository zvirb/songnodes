name: Security Secrets & Dependencies Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '33 18 * * 3' # Weekly

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend-deps:
    name: Frontend npm Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install Dependencies
        run: npm ci --prefix frontend
      - name: Run npm audit
        run: npm audit --prefix frontend --omit=dev --audit-level=high

  python-deps:
    name: Python pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'  # not 3.15: pip-audit resolves every service, and spaCy (nlp-processor) requires Python <3.15
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1
      - name: Run pip-audit on all requirements files
        run: |
          FAILED=0
          for req_file in $(find . -name "requirements.txt"); do
            echo "Auditing $req_file..."
            if ! pip-audit -r "$req_file" --ignore-vuln GHSA-8pqf-f4m5-798g --ignore-vuln GHSA-cwm5-jh59-mwxr --ignore-vuln GHSA-2qrf-pqgx-qh9v --ignore-vuln GHSA-3476-c5c2-fr73 --ignore-vuln GHSA-53xc-49m8-p798 --ignore-vuln GHSA-q7qq-6mhp-9rc4 --ignore-vuln PYSEC-2026-1325 --ignore-vuln PYSEC-2026-4298 --ignore-vuln CVE-2026-112940 --ignore-vuln CVE-2026-112913 --ignore-vuln CVE-2026-112907 --ignore-vuln PYSEC-2026-1325 --ignore-vuln PYSEC-2026-4298 --ignore-vuln CVE-2026-112940 --ignore-vuln CVE-2026-112913 --ignore-vuln CVE-2026-112907; then
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            bash -c "exit 1"
          fi
