name: Security Secrets & Dependencies Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '33 18 * * 3' # Weekly

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e6dab246340401bf53eec993b8f05aebe80ac636 # v2.3.4
        with:
          version: v8.18.2

  frontend-deps:
    name: Frontend npm Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install Dependencies
        run: npm ci --prefix frontend
      - name: Run npm audit
        run: npm audit --prefix frontend --omit=dev --audit-level=high

  python-deps:
    name: Python pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pip-audit
        run: pip install pip-audit==2.7.3
      - name: Run pip-audit on all requirements files
        run: |
          FAILED=0
          for req_file in $(find . -name "requirements.txt"); do
            echo "Auditing $req_file..."
            if ! pip-audit -r "$req_file"; then
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            bash -c "exit 1"
          fi
