# Python unit tests that need no running services (tests/README.md, "Python test suites").
# The root suite and tests/integration need the development Compose stack and run locally.
name: python-tests

on:
  pull_request:
    paths: ["services/**", "scrapers/**", "tests/**", "pytest.ini", ".github/workflows/python-tests.yml"]
  push:
    branches: [main, develop]
    paths: ["services/**", "scrapers/**", "tests/**", "pytest.ini"]

permissions:
  contents: read

jobs:
  common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.15", cache: pip }
      - name: Install dependencies
        # services/common ships inside the REST image, so its requirements cover it;
        # the test requirements supply the plugins the root pytest.ini addopts need.
        run: pip install -r services/rest_api/requirements.txt -r tests/requirements-test.txt
      - name: services/common tests
        working-directory: services
        run: python -m pytest common/tests -q -p no:cacheprovider
      - name: refmb tests
        working-directory: services/common/refmb
        run: python -m pytest -q -p no:cacheprovider

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.15", cache: pip }
      - name: Install dependencies
        # Not tests/requirements.txt: its python-dateutil==3.0.0 conflicts with tidalapi
        # (scrapers). Only the packages tests/conftest.py imports are added, at its pins.
        run: >-
          pip install -r scrapers/requirements.txt -r services/rest_api/requirements.txt
          -r tests/requirements-test.txt docker==7.2.0 testcontainers==4.15.0
      - name: Collection check (whole root suite)
        run: python -m pytest --collect-only -q -p no:cacheprovider
      - name: tests/unit (no services needed)
        run: python -m pytest tests/unit -q -p no:cacheprovider
      - name: Install graph API test dependencies
        run: pip install -r services/graph-visualization-api/requirements-test.txt
      - name: graph-visualization-api unit tests
        working-directory: services/graph-visualization-api
        run: PYTHONPATH=.. python -m pytest tests/unit -q -p no:cacheprovider --no-cov
