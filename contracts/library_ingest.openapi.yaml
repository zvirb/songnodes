openapi: 3.0.3
info:
  title: songnodes Library Ingest API
  version: 1.0.0
paths:
  /api/v1/library/ingest:
    post:
      summary: Idempotent bulk ingest for music library data
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                run_meta:
                  type: object
                tracks:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      artist:
                        type: string
                      a:
                        type: string
                      title:
                        type: string
                      t:
                        type: string
                      mix_name:
                        type: string
                      m:
                        type: string
                      genre:
                        type: string
                      g:
                        type: string
                      pillar:
                        type: string
                      p:
                        type: string
                      bpm:
                        type: number
                      key:
                        type: string
                      k:
                        type: string
                      energy:
                        type: number
                      e:
                        type: number
                      rotation:
                        type: integer
                      rot:
                        type: integer
                      isrc:
                        type: string
                      tidal_id:
                        type: string
                      tidal:
                        type: string
                      deezer_id:
                        type: string
                      dz:
                        type: string
                      beatport_id:
                        type: string
                      bp:
                        type: string
                appearances:
                  type: array
                  items:
                    type: object
                chart_positions:
                  type: array
                  items:
                    type: object
                rotation_history:
                  type: array
                  items:
                    type: object
                pending:
                  type: array
                  items:
                    type: object
                rejected:
                  type: array
                  items:
                    type: object
                beatport_check:
                  type: array
                  items:
                    type: object
                sources:
                  type: array
                  items:
                    type: object
                runs:
                  type: array
                  items:
                    type: object
                sets:
                  type: array
                  items:
                    type: object
      responses:
        '202':
          description: Accepted for processing via job queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
        '409':
          description: Conflict (same idempotency key, different body)
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Idempotency key was already submitted with a different payload
