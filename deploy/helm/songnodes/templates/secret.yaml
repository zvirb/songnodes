{{- if .Values.secrets.create }}
{{- $postgresHost := .Values.config.data.POSTGRES_HOST | default "postgres-0.postgres-service.songnodes.svc.cluster.local" -}}
{{- $postgresPort := .Values.config.data.POSTGRES_PORT | default "5432" -}}
{{- $postgresDb := .Values.config.data.POSTGRES_DB | default "musicdb" -}}
{{- $postgresUser := .Values.config.data.POSTGRES_USER | default "musicdb_user" -}}

{{- /* Fetch existing secret if rendering in release to preserve generated secrets across upgrades */ -}}
{{- $existingSecret := lookup "v1" "Secret" .Values.global.namespace (default .Values.global.secretName .Values.secrets.name) -}}

{{- /* Postgres password */ -}}
{{- $pgPassVal := index .Values.secrets.stringData "POSTGRES_PASSWORD" | default "" -}}
{{- $pgPass := "" -}}
{{- if and $pgPassVal (not (hasPrefix "CHANGE_ME" $pgPassVal)) -}}
  {{- $pgPass = $pgPassVal -}}
{{- else if and $existingSecret (hasKey $existingSecret.data "POSTGRES_PASSWORD") -}}
  {{- $pgPass = index $existingSecret.data "POSTGRES_PASSWORD" | b64dec -}}
{{- else -}}
  {{- $pgPass = randAlphaNum 32 -}}
{{- end -}}

{{- /* Redis password */ -}}
{{- $redisPassVal := index .Values.secrets.stringData "REDIS_PASSWORD" | default "" -}}
{{- $redisPass := "" -}}
{{- if and $redisPassVal (not (hasPrefix "CHANGE_ME" $redisPassVal)) -}}
  {{- $redisPass = $redisPassVal -}}
{{- else if and $existingSecret (hasKey $existingSecret.data "REDIS_PASSWORD") -}}
  {{- $redisPass = index $existingSecret.data "REDIS_PASSWORD" | b64dec -}}
{{- else -}}
  {{- $redisPass = randAlphaNum 32 -}}
{{- end -}}

{{- /* RabbitMQ password */ -}}
{{- $rabbitPassVal := index .Values.secrets.stringData "RABBITMQ_PASS" | default "" -}}
{{- $rabbitPass := "" -}}
{{- if and $rabbitPassVal (not (hasPrefix "CHANGE_ME" $rabbitPassVal)) -}}
  {{- $rabbitPass = $rabbitPassVal -}}
{{- else if and $existingSecret (hasKey $existingSecret.data "RABBITMQ_PASS") -}}
  {{- $rabbitPass = index $existingSecret.data "RABBITMQ_PASS" | b64dec -}}
{{- else -}}
  {{- $rabbitPass = randAlphaNum 32 -}}
{{- end -}}

{{- /* Database URL */ -}}
{{- $dbUrlVal := index .Values.secrets.stringData "DATABASE_URL" | default "" -}}
{{- $dbUrl := "" -}}
{{- if and $dbUrlVal (not (contains "CHANGE_ME" $dbUrlVal)) -}}
  {{- $dbUrl = $dbUrlVal -}}
{{- else -}}
  {{- $dbUrl = printf "postgresql+asyncpg://%s:%s@%s:%s/%s" $postgresUser $pgPass $postgresHost $postgresPort $postgresDb -}}
{{- end -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ default .Values.global.secretName .Values.secrets.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "songnodes.labels" (dict "ctx" . "labels" (.Values.secrets.labels | default dict)) | nindent 4 }}
  {{- if or .Values.secrets.annotations .Values.global.commonAnnotations }}
  annotations:
    {{- include "songnodes.annotations" (dict "ctx" . "annotations" .Values.secrets.annotations) | nindent 4 }}
  {{- end }}
type: {{ .Values.secrets.type | default "Opaque" }}
stringData:
  POSTGRES_PASSWORD: {{ $pgPass | quote }}
  REDIS_PASSWORD: {{ $redisPass | quote }}
  RABBITMQ_PASS: {{ $rabbitPass | quote }}
  DATABASE_URL: {{ $dbUrl | quote }}
  {{- range $key, $value := .Values.secrets.stringData }}
  {{- if not (has $key (list "POSTGRES_PASSWORD" "REDIS_PASSWORD" "RABBITMQ_PASS" "DATABASE_URL")) }}
  {{- if and $value (not (hasPrefix "CHANGE_ME" $value)) }}
  {{ $key }}: {{ $value | quote }}
  {{- else }}
  {{ $key }}: ""
  {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
