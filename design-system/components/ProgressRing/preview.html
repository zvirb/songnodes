<!-- @dsCard group="Charts" height=730 subtitle="Sizes 24, 40 and 64; value in the centre from 40 up; label beside; empty and complete; a set against its length on a held scale, with removed tracks as a cut-out and a figure that may pass 100%" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>ProgressRing — preview</title></head>
<body>
<div class="sn-preview" id="root">
  <div class="sn-preview__label">Sizes · 24 inline, 40 in cards, 64 on hub tiles</div>
  <div class="sn-preview__row" id="sizes" style="gap: var(--space-8)"></div>
  <div class="sn-preview__label">In context · tonal module cards</div>
  <div class="sn-preview__row" id="ctx" style="align-items: stretch"></div>
  <div class="sn-preview__label">Held scale · a set against its length (the full circle is the set length)</div>
  <div class="sn-preview__row sn-m-sets" id="held" style="align-items: stretch"></div>
  <ul class="sn-progress-ring__key" aria-label="Key">
    <li><span class="sn-progress-ring__swatch" data-part="filled"></span>Planned</li>
    <li><span class="sn-progress-ring__swatch" data-part="open"></span>Still to fill</li>
    <li><span class="sn-progress-ring__swatch" data-part="removed"></span>Removed since the last save</li>
  </ul>
  <div class="sn-preview__label">Try it · the ring keeps its scale when a track leaves the set</div>
  <section class="sn-card sn-card--compact sn-m-sets" style="max-width: 520px">
    <div id="live"></div>
    <div class="sn-row" style="flex-wrap: wrap">
      <button class="sn-btn sn-btn--sm" type="button" id="rm">Remove the last track</button>
      <button class="sn-btn sn-btn--sm" type="button" id="add">Add a track</button>
      <button class="sn-btn sn-btn--sm sn-btn--quiet" type="button" id="save">Save set</button>
    </div>
  </section>
</div>
<script>
(function () {
  var S = window.SongNodes, F = S.format;
  var SW = { 24: 3, 40: 4, 64: 6 };
  /** ring(value 0–1, size, label, detail) -> HTML */
  function ring(p, size, label, detail) {
    var sw = SW[size], r = (size - sw) / 2, c = 2 * Math.PI * r, pct = Math.round(p * 100);
    var svg = '<svg class="sn-progress-ring__svg" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + " " + size + '" aria-hidden="true">' +
      '<circle class="sn-progress-ring__track" cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" stroke-width="' + sw + '"/>' +
      (p > 0 ? '<circle class="sn-progress-ring__fill" cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" stroke-width="' + sw + '" stroke-dasharray="' + c.toFixed(2) + '" stroke-dashoffset="' + (c * (1 - p)).toFixed(2) + '"/>' : "") + "</svg>";
    return '<span class="sn-progress-ring sn-progress-ring--' + size + '" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '" aria-label="' + S.esc(label) + '"' + (detail ? ' aria-valuetext="' + S.esc(pct + "%, " + detail) + '"' : "") + ">" +
      '<span class="sn-progress-ring__box">' + svg + (size >= 40 ? '<span class="sn-progress-ring__value" aria-hidden="true">' + pct + (size >= 64 ? "%" : "") + "</span>" : "") + "</span>" +
      '<span class="sn-progress-ring__text"><b>' + S.esc(label) + "</b><span>" + (size < 40 ? pct + "% · " : "") + S.esc(detail || "") + "</span></span></span>";
  }
  document.getElementById("sizes").innerHTML =
    ring(0.72, 24, "Target tracks found", "36 of 50") +
    ring(0.48, 40, "Library keyed", "616 of 1,284 tracks") +
    ring(0.72, 64, "Target tracks found", "36 of 50 this month");
  function card(mod, title, inner) {
    return '<section class="sn-card sn-card--tonal sn-card--compact sn-m-' + mod + '" style="min-width: 240px; flex: 1">' +
      '<div class="sn-card__head">' + S.icon(S.module(mod).icon, { cls: "sn-m-icon" }) + '<span class="body-strong">' + title + "</span></div>" + inner + "</section>";
  }
  document.getElementById("ctx").innerHTML =
    card("sources", "Target tracks", ring(0.72, 40, "Found", "36 of 50 · 14 still missing")) +
    card("harmony", "Key coverage", ring(0.48, 40, "Keyed", "616 of 1,284 · run key analysis")) +
    card("pipeline", "Audio analysis", ring(0, 40, "Not started", "Queued for 22:00") + ring(1, 24, "Beat grids", "Done for all 1,284"));
})();
</script>
<script>
/* Held scale: inline helper for this preview (no library). Minutes planned against the set length. */
(function () {
  var S = window.SongNodes;
  /** A duration under 120 min reads in minutes, from 120 min in hours and minutes. */
  function mins(m) { return m < 120 ? m + " min" : Math.floor(m / 60) + " h" + (m % 60 ? " " + (m % 60) + " min" : ""); }
  /** "x of y": both sides take the form of the scale y, so one figure keeps one unit. */
  function pair(x, y) { return y < 120 ? x + " of " + y + " min" : (x < 60 ? x + " min" : Math.floor(x / 60) + " h" + (x % 60 ? " " + (x % 60) + " min" : "")) + " of " + mins(y); }
  function arc(R, a0, a1) {
    var c = 32, x0 = c + R * Math.cos(a0), y0 = c + R * Math.sin(a0), x1 = c + R * Math.cos(a1), y1 = c + R * Math.sin(a1);
    return "M" + x0.toFixed(2) + " " + y0.toFixed(2) + "A" + R + " " + R + " 0 " + (a1 - a0 > Math.PI ? 1 : 0) + " 1 " + x1.toFixed(2) + " " + y1.toFixed(2);
  }
  /** o: {name, length (min, the held scale), planned (min), removed (min), removedTracks, empty (slots)} */
  function held(o) {
    var sw = 6, r = 29, C = 2 * Math.PI * r, p = o.planned / o.length, pct = Math.round(p * 100);
    var fill = Math.min(1, p), rem = Math.min(o.removed / o.length, 1 - fill), over = o.planned - o.length;
    var a0 = fill * 2 * Math.PI, a1 = (fill + rem) * 2 * Math.PI;
    var svg = '<svg class="sn-progress-ring__svg" width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">' +
      '<circle class="sn-progress-ring__track" cx="32" cy="32" r="' + r + '" stroke-width="' + sw + '"/>' +
      (fill > 0 ? '<circle class="sn-progress-ring__fill" cx="32" cy="32" r="' + r + '" stroke-width="' + sw + '" stroke-dasharray="' + (C * fill).toFixed(2) + " " + C.toFixed(2) + '"/>' : "") +
      (rem > 0 ? '<circle class="sn-progress-ring__removed" cx="32" cy="32" r="' + r + '" stroke-width="' + sw + '" stroke-dasharray="' + (C * rem).toFixed(2) + " " + C.toFixed(2) + '" stroke-dashoffset="' + (-C * fill).toFixed(2) + '"/>' +
        '<path class="sn-progress-ring__removed-edge" d="' + arc(r + sw / 2 - 0.5, a0, a1) + '"/><path class="sn-progress-ring__removed-edge" d="' + arc(r - sw / 2 + 0.5, a0, a1) + '"/>' : "") + "</svg>";
    var line1 = pair(o.planned, o.length) + " planned";
    var line2 = over > 0 ? mins(over) + " over the set length" : over === 0 ? (o.empty ? "At the set length, " + o.empty + (o.empty === 1 ? " slot" : " slots") + " still empty" : "Set is full") : mins(-over) + " still to fill" + (o.empty ? " · " + o.empty + (o.empty === 1 ? " slot" : " slots") + " empty" : "");
    var line3 = o.removed > 0 ? o.removedTracks + (o.removedTracks === 1 ? " track" : " tracks") + " removed since the last save (" + mins(o.removed) + ")" : "";
    var words = pct + "%, " + line1 + ", " + line2 + (line3 ? ", " + line3 : "");
    return '<span class="sn-progress-ring sn-progress-ring--64 sn-progress-ring--held" role="progressbar" aria-label="' + S.esc(o.name + ": set length filled") + '" aria-valuemin="0" aria-valuemax="' + o.length + '" aria-valuenow="' + Math.min(o.planned, o.length) + '" aria-valuetext="' + S.esc(words) + '">' +
      '<span class="sn-progress-ring__box">' + svg + '<span class="sn-progress-ring__value" aria-hidden="true">' + pct + "%</span></span>" +
      '<span class="sn-progress-ring__text"><b>' + S.esc(o.name) + "</b><span>" + line1 + "</span><span>" + line2 + "</span>" + (line3 ? "<span>" + line3 + "</span>" : "") + "</span></span>";
  }
  function card(o) { return '<section class="sn-card sn-card--compact" style="min-width: 250px; flex: 1">' + held(o) + "</section>"; }
  document.getElementById("held").innerHTML =
    card({ name: "Peak time Friday", length: 120, planned: 92, removed: 0, empty: 5 }) +
    card({ name: "Warm-up opener", length: 90, planned: 61, removed: 11, removedTracks: 2, empty: 5 }) +
    card({ name: "Closing", length: 120, planned: 128, removed: 0, empty: 0 });

  // operable: a set of 120 min, tracks of known length; the saved set is the last save
  var pool = [6, 5, 7, 6, 5, 6, 8, 5, 6, 7, 6, 5, 6, 7, 5, 6, 6, 7, 5, 6, 7, 6], n = 15, saved = 15, slots = 20;
  function sum(k) { var t = 0; for (var i = 0; i < k; i++) t += pool[i]; return t; }
  function paint() {
    var gone = Math.max(0, saved - n);
    document.getElementById("live").innerHTML = held({ name: "Peak time Friday", length: 120, planned: sum(n), removed: sum(saved) - sum(Math.min(n, saved)), removedTracks: gone, empty: Math.max(0, slots - n) });
    document.getElementById("rm").disabled = n === 0; document.getElementById("add").disabled = n === pool.length;
  }
  document.getElementById("rm").addEventListener("click", function () { n -= 1; paint(); });
  document.getElementById("add").addEventListener("click", function () { n += 1; paint(); });
  document.getElementById("save").addEventListener("click", function () { saved = n; paint(); });
  paint();
})();
</script>
</body>
</html>
