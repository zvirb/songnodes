/* APG radio group (from SegmentedControl) */

/* tooltip: 500 ms in, 0 out, hover + focus, Esc, hoverable (from Tooltip) */
function snTips(root) {
  var tip = document.createElement("div"); tip.className = "sn-tooltip"; tip.id = "sn-tip"; tip.setAttribute("role", "tooltip"); tip.hidden = true; document.body.appendChild(tip);
  var timer = null, owner = null;

    var r = el.getBoundingClientRect(), t = tip.getBoundingClientRect(), gap = 6;
    var top = r.top - t.height - gap; if (top < 4) top = r.bottom + gap;
    var left = Math.min(Math.max(4, r.left + r.width / 2 - t.width / 2), document.documentElement.clientWidth - t.width - 4);
    tip.style.top = (top + window.scrollY) + "px"; tip.style.left = (left + window.scrollX) + "px";

  function later(el) { clearTimeout(timer); timer = setTimeout(function () { show(el); }, 500); }
  root.addEventListener("pointerover", function (e) { var el = e.target.closest("[data-tip],[data-tip-html]"); if (el && el !== owner) later(el); });
  root.addEventListener("pointerout", function (e) { var el = e.target.closest("[data-tip],[data-tip-html]"); if (el && !el.contains(e.relatedTarget) && !tip.contains(e.relatedTarget)) hide(); });
  tip.addEventListener("pointerleave", function (e) { if (!owner || !owner.contains(e.relatedTarget)) hide(); });
  root.addEventListener("focusin", function (e) { var el = e.target.closest("[data-tip],[data-tip-html]"); if (el) later(el); else hide(); });
  root.addEventListener("focusout", function (e) { if (!e.relatedTarget || !e.relatedTarget.closest || !e.relatedTarget.closest("[data-tip],[data-tip-html]")) hide(); });

}
/* toast: one visible, Undo action, 8 s with an action (pauses on hover/focus) */
