<!-- @dsCard group="Pages" width=1280 height=1660 subtitle="Launcher: app header, SongNodes: Home title with data stamp, changes since the last visit, eight module cards in their tonal colours, recently opened sets and tracks, health strip with only problems expanded" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>HomePage — preview</title></head>
<body>
<div class="sn-preview sn-page" id="root">
  <a class="sn-skip" href="#main">Skip to main content</a>
  <div id="hdr" data-drawer-inert></div>
  <main class="sn-page__main sn-page-home" id="main" tabindex="-1" data-drawer-inert>
    <div id="ph"></div>
    <section class="sn-page__section" aria-labelledby="chg-t">
      <div class="sn-section-heading">
        <h2 class="sn-title title-m" id="chg-t"><span class="sn-lead">Since your last visit:</span> Thu 22 Oct, 23:40</h2>
        <p class="sn-section-heading__caveat">What changed in the library, sets and pipeline since you were last here.</p>
      </div>
      <div class="sn-figure-tile-row" role="list" aria-label="Changes since your last visit" id="changes"></div>
    </section>
    <section class="sn-page__section" aria-labelledby="mod-t">
      <div class="sn-section-heading"><h2 class="sn-title title-m" id="mod-t">Modules</h2><span class="sn-section-heading__count">8</span></div>
      <div class="sn-launcher-card__grid" id="grid"></div>
    </section>
    <div class="sn-page-home__recent">
      <section class="sn-card sn-page__section" aria-labelledby="rs-t">
        <div class="sn-section-heading"><h2 class="sn-title title-s" id="rs-t"><span class="sn-lead">Recently opened:</span> Sets</h2>
          <div class="sn-section-heading__end"><a class="sn-link sn-m-sets" href="#sets">All 12 saved sets</a></div></div>
        <ul class="sn-page__list" id="rsets"></ul>
      </section>
      <section class="sn-card sn-page__section" aria-labelledby="rt-t">
        <div class="sn-section-heading"><h2 class="sn-title title-s" id="rt-t"><span class="sn-lead">Recently opened:</span> Tracks</h2>
          <div class="sn-section-heading__end"><a class="sn-link sn-m-library" href="#library">Open the library</a></div></div>
        <ul class="sn-page__list" id="rtracks"></ul>
      </section>
    </div>
    <section class="sn-page__section" aria-labelledby="hl-t">
      <div class="sn-section-heading"><h2 class="sn-title title-m" id="hl-t">Health</h2>
        <div class="sn-section-heading__end"><a class="sn-link sn-m-pipeline" href="#pipeline">Open Pipeline health</a></div></div>
      <div class="sn-service-status-list" id="health"></div>
      <p class="sn-page-home__healthy" id="healthy"></p>
    </section>
  </main>
  <div id="drw"></div>
  <div class="sn-toast__region" role="status" aria-live="polite" aria-label="Notifications" id="toasts"></div>
  <p class="sn-sr" role="status" id="sn-live"></p>
</div>
<script>
(function () {
  var S = window.SongNodes;
  /* preview helper: APG menu keyboard model (arrows wrap, Home/End, typeahead, Esc, Tab) */
  function snVisible(list) { return Array.prototype.filter.call(list, function (el) { return el.offsetParent !== null || el.getClientRects().length > 0; }); }
  function snMenuKeys(menu, close) {
    var buf = "", timer = 0;
    function items() { return snVisible(menu.querySelectorAll('[role="menuitem"],[role="menuitemcheckbox"],[role="menuitemradio"]')); }
    menu.addEventListener("keydown", function (e) {
      var it = items(), i = it.indexOf(document.activeElement), n = it.length;
      if (!n) return;
      if (e.key === "ArrowDown") { e.preventDefault(); it[(i + 1) % n].focus(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); it[(i - 1 + n) % n].focus(); }
      else if (e.key === "Home" || e.key === "PageUp") { e.preventDefault(); it[0].focus(); }
      else if (e.key === "End" || e.key === "PageDown") { e.preventDefault(); it[n - 1].focus(); }
      else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); close(true); }
      else if (e.key === "Tab") { close(false); }
      else if (e.key.length === 1 && /\S/.test(e.key) && !e.ctrlKey && !e.metaKey && !e.altKey) {
        clearTimeout(timer); buf += e.key.toLowerCase(); timer = setTimeout(function () { buf = ""; }, 600);
        for (var k = 1; k <= n; k++) { var c = it[(i + k) % n], t = (c.querySelector(".sn-overflow-menu__text") || c).textContent.trim().toLowerCase(); if (t.indexOf(buf) === 0) { c.focus(); break; } }
      }
    });
    return items;
  }
  /** Wire a menu button: btn[aria-haspopup=menu][aria-expanded][aria-controls] + .sn-overflow-menu__menu[role=menu]. */
  function snMenu(btn, menu, onSelect) {
    function open(last) { menu.hidden = false; btn.setAttribute("aria-expanded", "true"); var it = items(); var t = last ? it[it.length - 1] : it[0]; if (t) t.focus(); }
    function close(back) { if (menu.hidden) return; menu.hidden = true; btn.setAttribute("aria-expanded", "false"); if (back) btn.focus(); }
    var items = snMenuKeys(menu, close);
    btn.addEventListener("click", function () { if (menu.hidden) open(false); else close(true); });
    btn.addEventListener("keydown", function (e) { if (e.key === "ArrowDown") { e.preventDefault(); open(false); } else if (e.key === "ArrowUp") { e.preventDefault(); open(true); } });
    menu.addEventListener("click", function (e) {
      var it = e.target.closest('[role^="menuitem"]'); if (!it) return;
      if (it.getAttribute("aria-disabled") === "true") { return; }
      if (it.hasAttribute("aria-checked")) it.setAttribute("aria-checked", it.getAttribute("aria-checked") === "true" ? "false" : "true");
      close(true); if (onSelect) onSelect(it);
    });
    document.addEventListener("pointerdown", function (e) { if (!menu.hidden && !menu.contains(e.target) && !btn.contains(e.target)) close(false); });
    return { open: open, close: close };
  }
  function snSay(msg) { var l = document.getElementById("sn-live"); if (l) { l.textContent = ""; setTimeout(function () { l.textContent = msg; }, 30); } }
  /** Menu markup. items: {h:"Heading"} | {sep:1} | {id,icon,label,kbd,reason,danger,checked,cls}. Groups follow each heading. */
  function snMenuHtml(id, labelledby, items, cls, title) {
    var S = window.SongNodes, h = '<div class="sn-overflow-menu__menu' + (cls ? " " + cls : "") + '" role="menu" id="' + id + '" ' + (labelledby ? 'aria-labelledby="' + labelledby + '"' : 'aria-label="' + S.esc(title ? "Actions for " + title[0] : "Actions") + '"') + ' hidden>', open = false, n = 0;
    if (title) h += '<div class="sn-overflow-menu__title" role="presentation">' + S.esc(title[0]) + (title[1] ? "<small>" + S.esc(title[1]) + "</small>" : "") + "</div>";
    items.forEach(function (it) {
      if (it.h) { if (open) h += "</div>"; n++; h += '<div role="group" aria-labelledby="' + id + "-h" + n + '"><div class="sn-overflow-menu__heading" id="' + id + "-h" + n + '" role="presentation">' + S.esc(it.h) + "</div>"; open = true; return; }
      if (it.sep) { if (open) { h += "</div>"; open = false; } h += '<div class="sn-overflow-menu__sep" role="separator"></div>'; return; }
      var rid = it.reason ? id + "-r" + (++n) : "";
      h += '<button type="button" tabindex="-1" class="sn-overflow-menu__item' + (it.danger ? " sn-overflow-menu__item--danger" : "") + (it.cls ? " " + it.cls : "") + '" role="' + (it.checked != null ? "menuitemcheckbox" : "menuitem") + '"' +
        (it.checked != null ? ' aria-checked="' + it.checked + '"' : "") + (it.id ? ' data-id="' + it.id + '"' : "") + (it.reason ? ' aria-disabled="true" aria-describedby="' + rid + '"' : "") + ">" +
        S.icon(it.checked != null ? "check" : (it.icon || "circle-dot"), { size: 16 }) + '<span class="sn-overflow-menu__label"><span class="sn-overflow-menu__text">' + S.esc(it.label) + "</span>" +
        (it.reason ? '<span class="sn-overflow-menu__reason" id="' + rid + '">' + S.esc(it.reason) + "</span>" : "") + "</span>" + (it.kbd ? "<kbd>" + S.esc(it.kbd) + "</kbd>" : "") + "</button>";
    });
    if (open) h += "</div>";
    return h + "</div>";
  }
  function snMenuButton(id, label, items, opts) {
    var S = window.SongNodes; opts = opts || {};
    return '<div class="sn-overflow-menu"><button class="sn-btn sn-btn--icon' + (opts.quiet === false ? "" : " sn-btn--quiet") + (opts.sm ? " sn-btn--sm" : "") + '" type="button" id="' + id + '-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="' + id + '" aria-label="' + S.esc(label) + '">' + S.icon(opts.icon || "ellipsis") + "</button>" + snMenuHtml(id, id + "-btn", items, opts.cls) + "</div>";
  }

  /* preview helper: radiogroup with roving tabindex (APG radio group: arrows move and check, wrap, skip disabled) */
  function snSeg(group, onChange) {
    function radios() { return Array.prototype.slice.call(group.querySelectorAll('[role="radio"]')); }
    function pick(r, focus) {
      if (!r || r.getAttribute("aria-disabled") === "true") return;
      radios().forEach(function (x) { var on = x === r; x.setAttribute("aria-checked", on ? "true" : "false"); x.tabIndex = on ? 0 : -1; });
      if (focus) r.focus();
      if (onChange) onChange(r.getAttribute("data-value"), r);
    }
    radios().forEach(function (x) { x.tabIndex = x.getAttribute("aria-checked") === "true" ? 0 : -1; });
    group.addEventListener("click", function (e) { var r = e.target.closest('[role="radio"]'); if (r) pick(r, true); });
    group.addEventListener("keydown", function (e) {
      var rs = radios().filter(function (x) { return x.getAttribute("aria-disabled") !== "true"; }), i = rs.indexOf(document.activeElement);
      if (i < 0) return;
      var d = (e.key === "ArrowRight" || e.key === "ArrowDown") ? 1 : (e.key === "ArrowLeft" || e.key === "ArrowUp") ? -1 : 0;
      if (d) { e.preventDefault(); pick(rs[(i + d + rs.length) % rs.length], true); }
      else if (e.key === "Home") { e.preventDefault(); pick(rs[0], true); }
      else if (e.key === "End") { e.preventDefault(); pick(rs[rs.length - 1], true); }
      else if (e.key === " ") { e.preventDefault(); pick(document.activeElement, true); }
    });
    return { set: function (v) { pick(group.querySelector('[data-value="' + v + '"]'), false); } };
  }
  /** Build the markup for a segmented control. opts: [{value,label,icon,disabled,reason}] */
  function snSegHtml(label, opts, value, cls) {
    var S = window.SongNodes;
    return '<div class="sn-seg sn-segmented-control' + (cls ? " " + cls : "") + '" role="radiogroup" aria-label="' + S.esc(label) + '">' + opts.map(function (o) {
      return '<button type="button" role="radio" data-value="' + o.value + '" aria-checked="' + (o.value === value) + '"' + (o.disabled ? ' aria-disabled="true" title="' + S.esc(o.reason || "") + '"' : "") + (o.aria ? ' aria-label="' + S.esc(o.aria) + '"' : "") + ">" + (o.icon ? S.icon(o.icon, { size: 16 }) : "") + (o.label ? S.esc(o.label) : "") + "</button>";
    }).join("") + "</div>";
  }

  /* preview helper: modal drawer (APG dialog: focus moves in, Tab trapped, Esc and scrim close, focus returns to the opener) */
  function snDrawer(drawer, openers, onNavigate) {
    var panel = drawer.querySelector(".sn-nav-drawer__panel"), scrim = drawer.querySelector(".sn-nav-drawer__scrim"), last = null;
    var outside = Array.prototype.slice.call(document.querySelectorAll("[data-drawer-inert]"));
    function focusables() { return snVisible(panel.querySelectorAll('a[href],button:not([disabled]),[tabindex="0"]')); }
    function open(from) {
      last = from || openers[0];
      drawer.setAttribute("data-open", "");
      openers.forEach(function (o) { o.setAttribute("aria-expanded", "true"); });
      outside.forEach(function (el) { el.inert = true; });
      var cur = panel.querySelector('[aria-current="page"]'); (cur || focusables()[0]).focus();
    }
    function close() {
      drawer.removeAttribute("data-open");
      openers.forEach(function (o) { o.setAttribute("aria-expanded", "false"); });
      outside.forEach(function (el) { el.inert = false; });
      (last || openers[0]).focus();
    }
    openers.forEach(function (o) { o.addEventListener("click", function () { open(o); }); });
    scrim.addEventListener("click", close);
    drawer.querySelectorAll("[data-drawer-close]").forEach(function (b) { b.addEventListener("click", close); });
    panel.addEventListener("keydown", function (e) {
      if (e.key === "Escape") { e.preventDefault(); close(); return; }
      if (e.key !== "Tab") return;
      var f = focusables(), first = f[0], end = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); end.focus(); }
      else if (!e.shiftKey && document.activeElement === end) { e.preventDefault(); first.focus(); }
    });
    panel.addEventListener("click", function (e) {
      var a = e.target.closest("a.sn-nav-drawer__item"); if (!a) return;
      e.preventDefault();
      panel.querySelectorAll('[aria-current="page"]').forEach(function (x) { x.removeAttribute("aria-current"); });
      a.setAttribute("aria-current", "page");
      if (onNavigate) onNavigate(a);
      close();
    });
    return { open: open, close: close };
  }
  /** Drawer markup. current = module key or "home". counts = {key: [n, label, attention]} */
  function snDrawerHtml(id, current, counts, contained) {
    var S = window.SongNodes; counts = counts || {};
    var groups = [["Make", ["sets", "paths"]], ["Explore", ["graph", "library", "harmony"]], ["Collect", ["sources"]], ["System", ["pipeline", "services"]]];
    function row(key, label, icon, mod) {
      var c = counts[key];
      return '<li><a class="sn-nav-drawer__item' + (mod ? " sn-m-" + key : "") + '" href="#' + key + '" data-key="' + key + '"' + (current === key ? ' aria-current="page"' : "") + ">" + S.icon(icon, { size: 20 }) +
        '<span class="sn-nav-drawer__label">' + S.esc(label) + "</span>" +
        (c ? '<span class="' + (c[2] ? 'sn-pill" data-status="' + c[2] : "sn-nav-drawer__count") + '">' + c[0] + '<span class="sn-sr"> ' + S.esc(c[1]) + "</span></span>" : "") + "</a></li>";
    }
    var h = '<div class="sn-nav-drawer' + (contained ? " sn-nav-drawer--contained" : "") + '" id="' + id + '"><div class="sn-nav-drawer__scrim"></div>' +
      '<div class="sn-nav-drawer__panel" role="dialog" aria-modal="true" aria-label="Site navigation">' +
      '<div class="sn-nav-drawer__head"><span class="sn-nav-drawer__wordmark">SongNodes</span><button class="sn-btn sn-btn--quiet sn-btn--icon" type="button" data-drawer-close aria-label="Close navigation">' + S.icon("x") + "</button></div>" +
      '<nav class="sn-nav-drawer__nav" aria-label="Main"><ul class="sn-nav-drawer__list">' + row("home", "Home", "house", false) + "</ul>";
    groups.forEach(function (g, gi) {
      h += '<div class="sn-nav-drawer__group"><h2 class="sn-nav-drawer__heading" id="' + id + "-g" + gi + '">' + g[0] + '</h2><ul class="sn-nav-drawer__list" aria-labelledby="' + id + "-g" + gi + '">';
      g[1].forEach(function (k) { var m = S.module(k); h += row(k, m.label, m.icon, true); });
      h += "</ul></div>";
    });
    h += '</nav><div class="sn-nav-drawer__foot">' +
      '<a class="sn-nav-drawer__item" href="#preferences" data-key="preferences">' + S.icon("sliders-horizontal", { size: 20 }) + '<span class="sn-nav-drawer__label">Preferences</span></a>' +
      '<button class="sn-nav-drawer__item" type="button" data-drawer-close>' + S.icon("keyboard", { size: 20 }) + '<span class="sn-nav-drawer__label">Keyboard shortcuts</span><kbd>?</kbd></button>' +
      "</div></div></div>";
    return h;
  }


  /* page shell helpers (Pages A): AppHeader, PageHeader, drawer wiring, toast */
  var NOW = new Date("2026-10-24T21:30:00+11:00");
  var KB = /Mac|iPhone|iPad/.test(navigator.platform) ? "⌘K" : "Ctrl K";
  /** AppHeader markup. o: {lead, title, stamp, conn:[state,text,sub], mode, menu} */
  function snHeader(o) {
    var st = o.stamp ? new Date(o.stamp) : null;
    var menu = (o.menu || []).concat([{ sep: 1 }, { id: "prefs", icon: "sliders-horizontal", label: "Preferences" }, { id: "keys", icon: "keyboard", label: "Keyboard shortcuts", kbd: "?" }]);
    if (!o.menu || !o.menu.length) menu = menu.slice(1);
    return '<header class="sn-app-header"><div class="sn-app-header__bar">' +
      '<div class="sn-app-header__start"><button class="sn-btn sn-btn--quiet sn-btn--icon" type="button" data-opener aria-expanded="false" aria-controls="nav" aria-label="Open navigation">' + S.icon("menu") + "</button>" +
      '<span class="sn-app-header__wordmark">SongNodes</span></div>' +
      '<span class="sn-app-header__divider" aria-hidden="true"></span>' +
      '<p class="sn-app-header__title"><span class="sn-lead">' + S.esc(o.lead) + ":</span> " + S.esc(o.title) + "</p>" +
      (o.mode ? '<div class="sn-app-header__mode">' + snSegHtml("Mode", [{ value: "play", label: "Play" }, { value: "plan", label: "Plan" }], o.mode, "sn-segmented-control--sm") + "</div>" : "") +
      '<div class="sn-app-header__end">' +
      (st ? '<span class="sn-app-header__stamp">' + S.icon("clock", { size: 14 }) + '<span class="sn-app-header__stamp-text">Data from </span><time datetime="' + st.toISOString() + '" title="Data from ' + S.format.stamp(st) + '">' + S.format.relative(st, NOW) + "</time></span>" : "") +
      (o.conn ? '<span class="sn-connection-status" data-state="' + o.conn[0] + '" role="status" title="' + S.esc(o.conn[2] || "") + '">' + S.esc(o.conn[1]) + "</span>" : "") +
      '<button class="sn-btn sn-btn--sm sn-app-header__search" type="button" aria-keyshortcuts="Control+K Meta+K /" data-search>' + S.icon("search", { size: 16 }) + '<span class="sn-app-header__search-label">Search</span><kbd aria-hidden="true">' + KB + "</kbd></button>" +
      snMenuButton("hmore", "More actions", menu) + "</div></div></header>";
  }
  /** PageHeader markup. o: {mod, lead, here, title, size, desc, stampVerb, stamp, pill, secondary:[[id,icon,label]], menu, primary:[icon,label]} */
  function snPageHeader(o) {
    var m = o.mod ? S.module(o.mod) : null, st = o.stamp ? new Date(o.stamp) : null;
    var menu = (o.secondary || []).map(function (b) { return { id: b[0], icon: b[1], label: b[2], cls: "sn-page-header__narrow-only" }; }).concat(o.menu || []);
    return '<header class="sn-page-header' + (m ? " sn-m-" + o.mod : "") + '">' +
      (m ? '<div class="sn-page-header__band">' + S.icon(m.icon, { size: 16 }) + '<a class="sn-link" href="#' + o.mod + '">' + S.esc(m.label) + "</a>" +
        (o.here ? '<span class="sn-page-header__band-sep" aria-hidden="true">›</span><span class="sn-page-header__band-here">' + S.esc(o.here) + "</span>" : "") + "</div>" : "") +
      '<div class="sn-page-header__main"><div class="sn-page-header__text">' + S.html.title(o.lead || (m && m.label), o.title, o.size || "title-l") +
      (o.desc ? '<p class="sn-page-header__desc">' + o.desc + "</p>" : "") +
      (st || o.pill || o.meta ? '<p class="sn-page-header__meta">' + (st ? '<span class="sn-page-header__stamp">' + S.icon("clock", { size: 14 }) + S.esc(o.stampVerb) + ' <time datetime="' + st.toISOString() + '">' + S.format.stamp(st) + "</time></span>" : "") + (o.pill || "") + (o.meta || "") + "</p>" : "") + "</div>" +
      (o.primary || menu.length ? '<div class="sn-page-header__actions">' +
        (o.secondary || []).map(function (b) { return '<button class="sn-btn sn-page-header__secondary" type="button" data-act="' + b[0] + '">' + S.icon(b[1]) + S.esc(b[2]) + "</button>"; }).join("") +
        (menu.length ? snMenuButton("pmore", "More actions", menu, { quiet: false }) : "") +
        (o.primary ? '<button class="sn-btn sn-btn--primary" type="button" data-act="primary">' + S.icon(o.primary[0]) + S.esc(o.primary[1]) + "</button>" : "") + "</div>" : "") +
      "</div></header>";
  }
  function snToast(text, icon, action) {
    var r = document.getElementById("toasts"); if (!r) return;
    r.innerHTML = '<div class="sn-toast"><span class="sn-toast__icon">' + S.icon(icon || "circle-check") + '</span><span class="sn-toast__text">' + text + "</span>" +
      (action ? '<button class="sn-btn sn-btn--sm sn-toast__action" type="button">' + S.esc(action) + "</button>" : "") +
      '<button class="sn-btn sn-btn--sm sn-btn--icon sn-btn--quiet sn-toast__close" type="button" aria-label="Dismiss notification" data-toast-close>' + S.icon("x") + "</button></div>";
    clearTimeout(snToast.t); snToast.t = setTimeout(function () { r.innerHTML = ""; }, 8000);
  }
  /** Mount header + drawer and wire every menu, segmented control, the drawer and the search shortcut. */
  function snShell(o) {
    document.getElementById("hdr").innerHTML = snHeader(o);
    document.getElementById("drw").innerHTML = snDrawerHtml("nav", o.current, o.counts || { sources: ["4", "imports to review"], pipeline: ["2", "scrapers paused after errors", "warn"] });
  }
  function snWire(onMenu) {
    document.querySelectorAll('.sn-overflow-menu > button[aria-haspopup="menu"]').forEach(function (b) {
      snMenu(b, document.getElementById(b.getAttribute("aria-controls")), function (it) { if (onMenu) onMenu(it.getAttribute("data-id"), it); else snSay(it.textContent.trim() + " chosen"); });
    });
    document.querySelectorAll('.sn-segmented-control[role="radiogroup"]').forEach(function (g) { if (!g._wired) { g._wired = 1; snSeg(g, function (v, r) { snSay(r.textContent.trim() + " selected"); }); } });
    var openers = Array.prototype.slice.call(document.querySelectorAll("[data-opener]"));
    snDrawer(document.getElementById("nav"), openers, function (a) { snSay("Opened " + a.textContent.trim()); });
    document.addEventListener("keydown", function (e) {
      var typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.target.isContentEditable;
      if ((e.key === "k" || e.key === "K") && (e.ctrlKey || e.metaKey) || (e.key === "/" && !typing)) { e.preventDefault(); var s = document.querySelector("[data-search]"); if (s) s.focus(); snSay("Quick search opens here"); }
    });
    document.addEventListener("click", function (e) { if (e.target.closest("[data-toast-close]")) document.getElementById("toasts").innerHTML = ""; });
  }

  snShell({ lead: "SongNodes", title: "Home", stamp: "2026-10-24T06:00:00+11:00", current: "home" });
  document.getElementById("ph").innerHTML = snPageHeader({ lead: "SongNodes", title: "Home", size: "title-l",
    desc: "Eight modules over one Melbourne club library: 1,284 tracks, 8,903 connections, 12 saved sets.",
    meta: '<span class="sn-freshness-stamp" role="status">' + S.icon("clock", { size: 16 }) + '<span>Data from <time datetime="2026-10-23T19:00:00Z" title="' + S.format.relative("2026-10-23T19:00:00Z", NOW) + '">' + S.format.stamp("2026-10-23T19:00:00Z") + '</time></span><span class="sn-freshness-stamp__rel">(' + S.format.relative("2026-10-23T19:00:00Z", NOW) + ')</span></span>' });

  var changes = [
    ["36", "tracks added to the library", "+36 since Thu", "library", "Review new tracks"],

    { mod: "harmony", title: "24 keys in use", summary: "8A and 9A carry a third of the crate; 2B and 3B are thin.", figs: [["96", "tracks in 8A"], ["8", "tracks in 2B"]] },

    { mod: "pipeline", title: "9 scrapers", summary: "MixesDB and Setlist.fm paused after repeated errors.", figs: [["7", "running"], ["2", "paused"]], pill: ["bad", "2 paused after errors"] },
    { mod: "services", title: "2 of 3 connected", summary: "Spotify connected. TIDAL sign-in expired on 21 Oct.", figs: [["2", "connected"], ["1", "needs sign-in"]], pill: ["warn", "TIDAL expired"] }

  document.getElementById("grid").innerHTML = cards.map(function (c, i) {

    return '<div class="sn-card sn-card--tonal sn-launcher-card sn-m-' + c.mod + '">' +
      '<div class="sn-card__head"><span class="sn-launcher-card__icon">' + S.icon(m.icon) + "</span>" + (c.pill ? '<span class="sn-pill" data-status="' + c.pill[0] + '" id="' + id + '-p">' + S.esc(c.pill[1]) + "</span>" : "") + "</div>" +
      '<h3 class="sn-title title-s" id="' + id + '-t"><a class="sn-launcher-card__link" href="#' + c.mod + '" aria-describedby="' + id + "-s " + id + "-f" + (c.pill ? " " + id + "-p" : "") + '"><span class="sn-lead">' + S.esc(m.label) + ":</span> " + S.esc(c.title) + "</a></h3>" +
      '<p class="sn-launcher-card__summary" id="' + id + '-s">' + S.esc(c.summary) + "</p>" +
      '<dl class="sn-launcher-card__figures" id="' + id + '-f">' + c.figs.map(function (f) { return '<div class="sn-launcher-card__figure"><dt>' + S.esc(f[1]) + "</dt><dd>" + S.esc(f[0]) + "</dd></div>"; }).join("") + "</dl></div>";
  }).join("");

  function when(iso) { return '<time datetime="' + iso + '" title="' + S.format.stamp(iso) + '">' + S.format.relative(iso, NOW) + "</time>"; }
  document.getElementById("rsets").innerHTML = [
    ["Peak time Friday", "92 min · 14 tracks", "2026-10-24T21:30:00+11:00"],

  ].map(function (r) { return '<li class="sn-page__item"><a class="sn-link sn-m-sets" href="#sets">' + S.esc(r[0]) + '</a><span class="sn-page__item-meta">' + r[1] + " · " + when(r[2]) + "</span></li>"; }).join("");

    ["Bicep – Glue", "8A", 130, 6], ["Overmono – So U Kno", "9A", 130, 7], ["Sammy Virji – If U Need It", "4A", 136, 8],

  ].map(function (r) { return '<li class="sn-page__item"><a class="sn-link sn-m-library" href="#library">' + S.esc(r[0]) + '</a><span class="sn-page__item-meta">' + S.html.energy(r[3]) + S.html.key(r[1]) + '<span class="sn-bpm"><b>' + r[2] + "</b></span></span></li>"; }).join("");

  document.getElementById("health").innerHTML = [
    { svc: "Scrapers", mark: S.icon("activity", { size: 16 }), status: "bad", word: "2 paused after errors", detail: "MixesDB and Setlist.fm stopped after 5 failed requests in a row at 20:55. Retries at 21:45 AEDT; the other 7 keep running.", act: '<span class="sn-m-pipeline"><button class="sn-btn sn-btn--sm sn-btn--mod" type="button">Open scrapers</button></span>' },
    { svc: "TIDAL", mark: "Ti", status: "warn", word: "Expired", detail: "Sign-in expired 21 Oct 2026, 06:00 AEDT. Monday’s “Send to TIDAL” run will skip until you reconnect.", act: '<button class="sn-btn sn-btn--sm sn-service-status__btn--tidal" type="button">Reconnect TIDAL</button>' }
  ].map(function (r) {
    return '<section class="sn-service-status" aria-label="' + r.svc + '"><span class="sn-service-status__mark" aria-hidden="true">' + r.mark + '</span>' +
      '<div class="sn-service-status__main"><div class="sn-service-status__name">' + r.svc + ' <span class="sn-pill sn-status-pill" data-status="' + r.status + '">' + r.word + '</span></div><div class="sn-service-status__detail">' + r.detail + "</div></div>" +
      '<div class="sn-service-status__act">' + r.act + "</div></section>";
  }).join("");
  document.getElementById("healthy").innerHTML = "Working normally: " + S.html.pill("healthy", "API") + S.html.pill("ok", "Database") + S.html.pill("ok", "Spotify") + S.html.pill("ok", "Live updates");
  snWire();
})();
