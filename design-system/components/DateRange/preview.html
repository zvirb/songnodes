<!-- @dsCard group="Inputs" height=1290 subtitle="Pick a from–to span on two months: range ends in lavender, today in amber, public holidays and the weekly run marked, presets beside; live keyboard grid; phone-width sheet below" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>DateRange — preview</title>
<style>
  .pv-anchor { position: relative; display: block; }
  .pv-phone { width: 100%; max-width: 360px; }
  .pv-out { font-size: 0.8125rem; color: var(--fg-2); margin: 0; }
</style>
</head>
<body>
<div class="sn-preview" id="root">
  <div class="sn-preview__label">Export plays heard: the popover open from the calendar button (live: click, arrows, Page Up / Page Down, Home / End, Enter, Escape)</div>
  <div class="sn-row">
    <button class="sn-btn" type="button" id="open" aria-haspopup="dialog" aria-expanded="true" aria-controls="dr1">
      <span data-icon="calendar-range"></span><span id="open-label">Mon 9 – Fri 13 Nov 2026</span>
    </button>
    <p class="pv-out" id="out" aria-live="polite"></p>
  </div>
  <div class="pv-anchor"><div class="sn-popover sn-date-range--static" id="dr1"></div></div>

  <div class="sn-preview__label">Phone width (below 480px it is a full-width bottom sheet): one month, presets under it, footer buttons sharing a row; This week pressed, today (Wed 28 Oct) in amber</div>
  <div class="pv-phone"><div class="sn-popover sn-date-range--static sn-date-range--one sn-date-range--sheet" id="dr2"></div></div>
</div>
<script>
  var S = window.SongNodes, C = S.calendar;
  document.querySelectorAll("[data-icon]").forEach(function (el) { el.outerHTML = S.icon(el.getAttribute("data-icon")); });
  var NOW = "2026-10-28";  // fixed "today" for the preview (Melbourne date)
  // Day marks are data the page passes in. Victorian public holidays and the weekly library run (Saturdays).
  var MARKS = [
    { date: "2026-11-03", code: "PH", name: "Melbourne Cup", kind: "Public holiday" },
    { date: "2026-12-25", code: "PH", name: "Christmas Day", kind: "Public holiday" },
    { date: "2026-12-28", code: "PH", name: "Boxing Day (observed)", kind: "Public holiday" }
  ];
  for (var d = "2026-10-31"; d <= "2027-01-31"; d = C.addDays(d, 7)) MARKS.push({ date: d, code: "RUN", name: "Weekly run", kind: "Weekly library run" });
  ["2026-11-06", "2026-11-07", "2026-11-13", "2026-11-14", "2026-11-20", "2026-11-21", "2026-11-27", "2026-11-28", "2026-12-04", "2026-12-05"].forEach(function (d) { MARKS.push({ date: d, name: "Plays heard", kind: "Plays heard" }); });
  var PRESETS = ["last-7-days", "last-30-days", "this-year", "last-week", "this-week", "next-week",
    { id: "summer", label: "Summer 2026–27", range: ["2026-12-01", "2027-02-28"] }];

  var btn = document.getElementById("open"), pop = document.getElementById("dr1"), out = document.getElementById("out");
  var dr = S.dateRange(pop, {
    from: "2026-11-09", to: "2026-11-13", today: NOW, title: "Plays to export", outcome: "Download CSV",
    marks: MARKS, presets: PRESETS,
    onChange: function (a, b) { document.getElementById("open-label").textContent = a ? S.format.range(a, b || a) : "Pick the dates"; },
    onApply: function (a, b) { out.textContent = "Would download plays_" + a + "_" + b + ".csv"; },
    onClose: function () { pop.hidden = true; btn.setAttribute("aria-expanded", "false"); btn.focus(); }
  });
  pop.classList.add("sn-popover");
  btn.addEventListener("click", function () {
    var open = pop.hidden; pop.hidden = !open; btn.setAttribute("aria-expanded", String(open));
    if (open) dr.focus();
  });

  var dr2 = S.dateRange(document.getElementById("dr2"), {
    from: "2026-10-26", to: "2026-11-01", preset: "this-week", today: NOW, title: "Gig dates", outcome: "Use these dates",
    marks: MARKS.filter(function (m) { return m.code; }), presets: ["last-week", "this-week", "next-week"]
  });
</script>
</body>
</html>
