<!-- @dsCard group="Feedback" height=480 subtitle="Plain confirmation, with Undo before the dismiss button, with queue count, a long one that wraps; live demo through SongNodes.toast: one visible, up to 3 queued, 4 s or 8 s with an action, pauses on hover and focus" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Toast — preview</title>
<style>
  .pv-col { display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-2); }
  .pv-narrow { width: min(21rem, 100%); }
</style>
</head>
<body>
<div class="sn-preview" id="root">
  <div class="sn-preview__label">Examples (static): the one action sits before the dismiss button; a long toast wraps, its buttons never break</div>
  <div class="pv-col" inert id="examples"></div>
  <div class="sn-preview__label">Try it: toasts appear at the bottom (bottom-right from 1,100 px)</div>
  <div class="sn-preview__row">
    <button class="sn-btn" type="button" data-toast="save">Save set</button>
    <button class="sn-btn" type="button" data-toast="copy">Copy tracklist</button>
    <button class="sn-btn" type="button" data-toast="add">Add Bicep – Glue to set</button>
    <button class="sn-btn sn-btn--quiet" type="button" id="burst">Do all three at once</button>
  </div>
  <p class="sn-inline-message" data-status="info" id="log">Undo puts the track back where it was. A failure is never a toast: it is an inline message or a banner.</p>
</div>
<script>
  var S = window.SongNodes, I = S.icon;
  S.toast.mount();   // the live region exists before the first words are added
  // static pictures of the markup SongNodes.toast draws
  function toastHTML(t) {
    return '<div class="sn-toast' + (t.narrow ? " pv-narrow" : "") + '">' +
      '<span class="sn-toast__icon">' + I("circle-check") + '</span>' +
      '<span class="sn-toast__text">' + t.html + '</span>' +
      (t.queued ? '<span class="sn-toast__queue">+' + t.queued + ' more</span>' : "") +
      (t.action ? '<button class="sn-btn sn-btn--sm sn-toast__action" type="button">' + t.action + '</button>' : "") +
      '<button class="sn-btn sn-btn--sm sn-btn--icon sn-btn--quiet sn-toast__close" type="button" aria-label="Dismiss notification">' + I("x") + '</button></div>';
  }
  document.getElementById("examples").innerHTML =
    toastHTML({ html: "Set saved" }) + toastHTML({ html: 'Added to <q>Peak time Friday</q>', action: "Undo" }) + toastHTML({ html: "Tracklist copied: 18 tracks", queued: 2 }) +
    toastHTML({ html: 'Removed Ross From Friends – Talk To Me You’ll Drown from <q>Peak time Friday</q>', action: "Undo", narrow: true });

  var log = document.getElementById("log");
  var KINDS = {
    save: function () { S.toast("Set saved"); },
    copy: function () { S.toast({ text: "Tracklist copied: 18 tracks" }); },
    add: function () { S.toast({ html: 'Added to <q>Peak time Friday</q>', action: "Undo", onAction: function () { log.textContent = "Undone: Bicep – Glue removed from “Peak time Friday”."; } }); }
  };
  document.addEventListener("click", function (e) { var b = e.target.closest("[data-toast]"); if (b) KINDS[b.getAttribute("data-toast")](); });
  document.getElementById("burst").addEventListener("click", function () { KINDS.save(); KINDS.copy(); KINDS.add(); });
</script>
</body>
</html>
