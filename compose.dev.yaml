name: songnodes-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: songnodes
      POSTGRES_DB: songnodes
      PGDATA: /var/lib/postgresql/data/pgdata
      # Local development only; no database port is exposed to the host.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - dev-postgres-18:/var/lib/postgresql/data
      - ./sql/migrations/medallion/001_bronze_layer_up.sql:/docker-entrypoint-initdb.d/001-bronze.sql:ro
      - ./sql/migrations/medallion/002_silver_layer_up.sql:/docker-entrypoint-initdb.d/002-silver.sql:ro
      - ./sql/migrations/medallion/006_track_adjacency_edges_up.sql:/docker-entrypoint-initdb.d/006-transitions.sql:ro
      - ./sql/migrations/012_target_tracks_up.sql:/docker-entrypoint-initdb.d/012-target-tracks.sql:ro
      - ./sql/migrations/013_ingestion_jobs_up.sql:/docker-entrypoint-initdb.d/013-ingestion-jobs.sql:ro
      - ./sql/migrations/014_data_layer_up.sql:/docker-entrypoint-initdb.d/014-data-layer.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U songnodes -d songnodes']
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.10-alpine
    volumes:
      - /data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20

  graph-api:
    build:
      context: .
      dockerfile: services/graph-visualization-api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://songnodes@postgres:5432/songnodes
      REDIS_HOST: redis
      REDIS_PASSWORD: ''
    ports: ['127.0.0.1:8084:8084']
    networks:
      default:
        aliases: [graph-visualization]   # the frontend image's nginx proxies to this name
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  rest-api:
    build:
      context: .
      dockerfile: services/rest_api/Dockerfile
    environment:
      DATABASE_URL: postgresql://songnodes@postgres:5432/songnodes
      REDIS_HOST: redis
      REDIS_PASSWORD: ''
      # OAuth sign-in for Spotify and TIDAL (routers/music_auth.py), from the host environment or an untracked .env.
      MB_LOCAL_ENABLED: ${MB_LOCAL_ENABLED:-false}
      MB_LOCAL_HOST: ${MB_LOCAL_HOST:-host.docker.internal}
      MB_LOCAL_PORT: ${MB_LOCAL_PORT:-55433}
      MB_LOCAL_DATABASE: ${MB_LOCAL_DATABASE:-ref_mb}
      MB_LOCAL_SCHEMA: ${MB_LOCAL_SCHEMA:-ref_mb}
      MB_LOCAL_USER: ${MB_LOCAL_USER:-ref_mb_reader}
      MB_LOCAL_PASSWORD_FILE: ${MB_LOCAL_PASSWORD_FILE:-}
      MB_LOCAL_PASSWORD: ${MB_LOCAL_PASSWORD:-}
      MB_LOCAL_STATEMENT_TIMEOUT_MS: ${MB_LOCAL_STATEMENT_TIMEOUT_MS:-2000}
      TIDAL_CLIENT_ID: ${TIDAL_CLIENT_ID:-}
      TIDAL_CLIENT_SECRET: ${TIDAL_CLIENT_SECRET:-}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
    ports: ['127.0.0.1:8082:8082']
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8082/health', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.3-alpine
    volumes:
      - dev-rabbitmq-4:/var/lib/rabbitmq
    # Development only: default guest credentials, reachable inside the compose network only (no published port).
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 10s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://songnodes@postgres:5432/songnodes
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      UNIFIED_SCRAPER_URL: ${UNIFIED_SCRAPER_URL:-http://unified-scraper:8000}
      # Provider credentials are read from the host environment or an untracked .env file; none are committed.
      MB_LOCAL_ENABLED: ${MB_LOCAL_ENABLED:-false}
      MB_LOCAL_HOST: ${MB_LOCAL_HOST:-host.docker.internal}
      MB_LOCAL_PORT: ${MB_LOCAL_PORT:-55433}
      MB_LOCAL_DATABASE: ${MB_LOCAL_DATABASE:-ref_mb}
      MB_LOCAL_SCHEMA: ${MB_LOCAL_SCHEMA:-ref_mb}
      MB_LOCAL_USER: ${MB_LOCAL_USER:-ref_mb_reader}
      MB_LOCAL_PASSWORD_FILE: ${MB_LOCAL_PASSWORD_FILE:-}
      MB_LOCAL_PASSWORD: ${MB_LOCAL_PASSWORD:-}
      MB_LOCAL_STATEMENT_TIMEOUT_MS: ${MB_LOCAL_STATEMENT_TIMEOUT_MS:-2000}
      TIDAL_CLIENT_ID: ${TIDAL_CLIENT_ID:-}
      TIDAL_CLIENT_SECRET: ${TIDAL_CLIENT_SECRET:-}
      TIDAL_COUNTRY_CODE: ${TIDAL_COUNTRY_CODE:-AU}
      DISCOGS_TOKEN: ${DISCOGS_TOKEN:-}
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      MUSICBRAINZ_CONTACT: ${MUSICBRAINZ_CONTACT:-}
      GETSONGBPM_API_KEY: ${GETSONGBPM_API_KEY:-}
      GETSONGBPM_ENABLED: ${GETSONGBPM_ENABLED:-false}
      PROVIDER_GROUPS: ${PROVIDER_GROUPS:-}
      # 'none' keeps the dev stack and its tests from calling external providers; list names (e.g. tidal,deezer) to enable.
      ENRICHMENT_PROVIDERS: ${ENRICHMENT_PROVIDERS:-none}
    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

  unified-scraper:
    # The only scraper service. POST /scrape is synchronous (up to 15 minutes) and writes bronze itself.
    build:
      context: scrapers
      dockerfile: Dockerfile.unified
    environment:
      # The compose Postgres trusts connections from inside the network, so no password is needed or set.
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: songnodes
      DATABASE_USER: songnodes
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: songnodes
      POSTGRES_USER: songnodes
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: songnodes
      DB_USER: songnodes
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      DISCOGS_API_TOKEN: ${DISCOGS_API_TOKEN:-}
    ports: ['127.0.0.1:8012:8000']
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: frontend
    ports: ['127.0.0.1:3006:8080']
    depends_on:
      rest-api: {condition: service_healthy}
      graph-api: {condition: service_started}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/']
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  dev-postgres:
  dev-postgres-18:
  dev-rabbitmq-4:
